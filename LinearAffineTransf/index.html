<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>2次元の線形変換とアフィン変換</title>
<style>
  :root{
    --bg:#0d1317; --panel:#141d23; --line:#25333b; --txt:#d9e6ec; --dim:#7e949f;
    --accent:#3ddbb0; --warm:#f5a623; --blue:#5aa9ff; --red:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased;line-break:strict;word-break:normal}
  /* dvh keeps the layout out from under iOS Safari's collapsing toolbars */
  #app{display:flex;height:100vh;height:100dvh;width:100%;overscroll-behavior:none}

  /* ---------- panel ---------- */
  #panel{width:330px;flex:0 0 330px;background:var(--panel);border-right:1px solid var(--line);
    overflow-y:auto;padding:14px 14px 32px}
  h1{font-size:14px;letter-spacing:.06em;margin:0 0 2px;color:var(--accent)}
  .sub{color:var(--dim);font-size:11px;margin-bottom:12px}
  section{margin-bottom:12px;padding-bottom:11px;border-bottom:1px solid var(--line)}
  section:last-child{border-bottom:none}
  .lbl{font-size:10.5px;letter-spacing:.08em;color:var(--dim);margin-bottom:8px}

  .matrixGrid{display:grid;grid-template-columns:26px 62px 62px 16px 62px;gap:6px;align-items:center}
  .colHead{font-size:10px;color:var(--dim);text-align:center}
  .rowHead{font-size:11px;color:var(--dim);text-align:right}
  .plus{text-align:center;color:var(--dim);font-size:11px}
  input.num{width:100%;background:#0b1114;border:1px solid var(--line);color:var(--txt);
    border-radius:4px;padding:5px 4px;font:12px ui-monospace,Menlo,monospace;text-align:center;
    transition:border-color .12s,background .12s}
  input.num:focus{outline:none;border-color:var(--accent);background:#0f1a1e}
  input.num.bad{border-color:var(--red)}

  .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  button{background:#1b262c;color:var(--txt);border:1px solid var(--line);border-radius:5px;
    padding:5px 4px;font:11.5px ui-monospace,Menlo,"Hiragino Sans","Noto Sans JP",sans-serif;cursor:pointer;text-align:center;
    transition:background .12s,border-color .12s,color .12s}
  button:hover{background:#22303a;border-color:#3a4d58}
  button:active{transform:translateY(1px)}
  button.on{border-color:var(--accent);color:var(--accent);background:#132a26}
  button.wide{grid-column:1 / -1}

  .toggles{display:grid;gap:6px}
  .tg{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:12px;color:#b7c8d0}
  .tg input{appearance:none;width:26px;height:14px;border-radius:7px;background:#243139;
    border:1px solid var(--line);position:relative;cursor:pointer;transition:background .15s;flex:0 0 auto}
  .tg input::after{content:"";position:absolute;top:1px;left:1px;width:10px;height:10px;border-radius:50%;
    background:#6c828d;transition:left .15s,background .15s}
  .tg input:checked{background:#1b3c35;border-color:#2f6a5b}
  .tg input:checked::after{left:13px;background:var(--accent)}

  .readout{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
  .readout dt{color:var(--dim)}
  .readout dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  .eqn{font-size:11.5px;line-height:1.6;color:#b7c8d0;white-space:nowrap;overflow-x:auto}
  .eqn b{color:var(--accent);font-weight:400}
  .eqn i{color:var(--warm);font-style:normal}
  .hint{color:var(--dim);font-size:11px;line-height:1.6;margin-top:6px}
  .warn{color:var(--red)}

  /* ---------- stage ---------- */
  #stage{min-height:150px;position:relative;flex:1 1 auto;min-width:0}
  canvas{display:block;cursor:grab;touch-action:none}
  canvas.dragging{cursor:grabbing}
  #hud{position:absolute;left:14px;bottom:12px;font-size:11px;color:#5b6f79;pointer-events:none;
    letter-spacing:.02em}
  #zoomBar{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
  #zoomBar button{width:30px;padding:4px 0;background:#151e24cc;backdrop-filter:blur(4px)}

  /* shown only when the page is trapped inside someone else's iframe */
  #expand{display:none;position:absolute;top:10px;right:10px;z-index:5;
    align-items:center;justify-content:center;gap:6px;padding:8px 11px;
    border:1px solid #3a4d58;border-radius:6px;background:#141d23e6;backdrop-filter:blur(4px);
    color:var(--accent);font:11px ui-monospace,Menlo,monospace;text-decoration:none;letter-spacing:.06em;
    box-shadow:0 2px 10px #0008}
  #expand:hover{background:#22303a;border-color:var(--accent)}
  body.embedded #expand{display:flex}
  @media (max-width:780px){ #expand{padding:11px 13px;font-size:12px} }

  /* very short viewports (phone-sized embeds): keep the diagram readable */
  @media (max-height:430px){
    #stage{min-height:104px}
    h1{font-size:11px}
    .sub{display:none}
    #panel{padding-top:9px}
    #panel section{margin-bottom:9px;padding-bottom:8px}
    #expand{margin-bottom:7px;padding:5px 6px}
  }

  @media (max-width:780px){
    #zoomBar button{width:42px;padding:9px 0;font-size:14px}
    #hud{display:none}
    #app{flex-direction:column-reverse}
    #panel{width:100%;flex:0 0 auto;max-height:52%;border-right:none;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>線形変換とアフィン変換</h1>
    <div class="sub">2次元の変換 · L字型テトリミノ</div>

    <section>
      <div class="lbl">変換</div>
      <div class="matrixGrid">
        <div></div><div class="colHead">x</div><div class="colHead">y</div><div></div><div class="colHead">1</div>
        <div class="rowHead">x′</div>
        <input class="num" id="i-a" value="1" inputmode="decimal" spellcheck="false">
        <input class="num" id="i-b" value="0" inputmode="decimal" spellcheck="false">
        <div class="plus">+</div>
        <input class="num" id="i-tx" value="0" inputmode="decimal" spellcheck="false">
        <div class="rowHead">y′</div>
        <input class="num" id="i-c" value="0" inputmode="decimal" spellcheck="false">
        <input class="num" id="i-d" value="1" inputmode="decimal" spellcheck="false">
        <div class="plus">+</div>
        <input class="num" id="i-ty" value="0" inputmode="decimal" spellcheck="false">
      </div>
      <div class="eqn" id="eqn" style="margin-top:10px"></div>
      <div class="hint">左のブロックが行列 <b style="color:var(--accent);font-weight:400">A</b>（線形部分）、
        右の列が平行移動 <i style="color:var(--warm);font-style:normal">t</i>（これを足すとアフィンになる）。</div>
    </section>

    <section>
      <div class="lbl">数値</div>
      <dl class="readout">
        <dt>det A</dt><dd id="r-det">1</dd>
        <dt>面積（最初は 4）</dt><dd id="r-area">4</dd>
        <dt>向き</dt><dd id="r-orient">保たれる</dd>
        <dt>点 (1, 1) の像</dt><dd id="r-pt">(1, 1) → (1, 1)</dd>
      </dl>
      <div class="hint" id="r-note"></div>
    </section>

    <section>
      <div class="lbl">プリセット</div>
      <div class="btns" id="presets"></div>
    </section>

    <section>
      <div class="lbl">表示</div>
      <div class="toggles">
        <label class="tg"><input type="checkbox" id="t-ghost" checked><span>もとの図形のゴースト</span></label>
        <label class="tg"><input type="checkbox" id="t-basis" checked><span>基本ベクトルの像</span></label>
        <label class="tg"><input type="checkbox" id="t-lattice"><span>整数格子の像</span></label>
        <label class="tg"><input type="checkbox" id="t-anim" checked><span>アニメーション</span></label>
      </div>
    </section>

  </aside>

  <main id="stage">
    <a id="expand" href="https://sergioandraus-wq.github.io/infomath/LinearAffineTransf/" target="_blank" rel="noopener" title="全画面表示で開く（別タブ）">⤢ 全画面</a>
    <canvas id="c"></canvas>
    <div id="hud">ドラッグ／ピンチで移動・拡大 · ⌘/Ctrl + スクロール</div>
    <div id="zoomBar">
      <button id="z-in" title="拡大">+</button>
      <button id="z-out" title="縮小">−</button>
      <button id="z-fit" title="表示をリセット">⌂</button>
    </div>
  </main>
</div>

<script>
(() => {
  'use strict';

  // If we're inside someone else's iframe (Google Sites, an LMS), the page
  // gets a fixed box that may be far too small. Offer the standalone page.
  try {
    if (window.self !== window.top) document.body.classList.add('embedded');
  } catch (_) {
    document.body.classList.add('embedded');   // cross-origin frame: same conclusion
  }

  // ───────────────────────────────── geometry of the tetromino ──
  const CELLS   = [[0,0],[0,1],[0,2],[1,0]];          // unit squares of the L piece
  const OUTLINE = [[0,0],[2,0],[2,1],[1,1],[1,3],[0,3]]; // boundary polygon
  const AREA0   = 4;

  // ───────────────────────────────── canvas & camera ──
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const view = { scale: 54, cx: 0, cy: 0, ready: false };
  let W = 1, H = 1;

  const sx = x => view.cx + x * view.scale;
  const sy = y => view.cy - y * view.scale;
  const P  = (x, y) => [sx(x), sy(y)];

  function fitView() {
    // Choose the zoom from the box we actually got: a Google Sites / LMS embed
    // can be only ~280px tall, where a fixed zoom would be unreadable.
    const usable = Math.max(110, H - 24);
    view.scale = clampScale(Math.min(64, Math.max(15, usable / 7.4)));
    view.cx = W / 2 - 1 * view.scale;      // centre the piece's centroid (1, 1.5)
    view.cy = H / 2 + 1.5 * view.scale;
    view.userMoved = false;
  }

  function resize() {
    const r = canvas.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const nw = Math.max(1, Math.round(r.width));
    const nh = Math.max(1, Math.round(r.height));
    const hPrev = H;
    if (view.ready) { view.cx += (nw - W) / 2; view.cy += (nh - H) / 2; }
    W = nw; H = nh;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!view.ready) { view.ready = true; fitView(); }
    else if (!view.userMoved && Math.abs(nh - hPrev) > 12) fitView();
    draw();
  }

  // ───────────────────────────────── transformation state ──
  const IDENT = { a: 1, b: 0, c: 0, d: 1, tx: 0, ty: 0 };
  let cur   = { ...IDENT };   // what is drawn right now (interpolated)
  let from  = { ...IDENT };
  let goal  = { ...IDENT };
  let animating = false, animStart = 0, animDur = 420;

  const opt = { ghost: true, basis: true, lattice: false, anim: true };

  const easeInOut = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

  function kick() {
    from = { ...cur };
    goal = readInputs();
    if (!opt.anim) { cur = { ...goal }; animating = false; draw(); return; }
    animStart = performance.now();
    animating = true;
    requestAnimationFrame(tick);
  }

  function tick(now) {
    const p = animating ? Math.min(1, (now - animStart) / animDur) : 1;
    const e = easeInOut(p);
    for (const k in goal) cur[k] = from[k] + (goal[k] - from[k]) * e;
    if (p >= 1) animating = false;
    draw();
    if (animating) requestAnimationFrame(tick);
  }

  const apply = (T, x, y) => [T.a*x + T.b*y + T.tx, T.c*x + T.d*y + T.ty];

  // ───────────────────────────────── drawing ──
  function drawGrid() {
    const x0 = (0 - view.cx) / view.scale, x1 = (W - view.cx) / view.scale;
    const y0 = (view.cy - H) / view.scale, y1 = view.cy / view.scale;

    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.055)';
    ctx.beginPath();
    for (let k = Math.ceil(x0); k <= Math.floor(x1); k++) {
      const X = Math.round(sx(k)) + 0.5;
      ctx.moveTo(X, 0); ctx.lineTo(X, H);
    }
    for (let k = Math.ceil(y0); k <= Math.floor(y1); k++) {
      const Y = Math.round(sy(k)) + 0.5;
      ctx.moveTo(0, Y); ctx.lineTo(W, Y);
    }
    ctx.stroke();

    // axes
    const ox = sx(0), oy = sy(0);
    ctx.strokeStyle = 'rgba(255,255,255,0.30)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, Math.round(oy) + 0.5); ctx.lineTo(W, Math.round(oy) + 0.5);
    ctx.moveTo(Math.round(ox) + 0.5, 0); ctx.lineTo(Math.round(ox) + 0.5, H);
    ctx.stroke();

    // axis arrowheads
    const head = (x, y, dx, dy) => {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - 9*dx + 4*dy, y - 9*dy + 4*dx);
      ctx.lineTo(x - 9*dx - 4*dy, y - 9*dy - 4*dx);
      ctx.closePath(); ctx.fill();
    };
    ctx.fillStyle = 'rgba(255,255,255,0.30)';
    if (oy > 6 && oy < H - 6) { head(W - 2, oy, 1, 0); head(2, oy, -1, 0); }
    if (ox > 6 && ox < W - 6) { head(ox, 2, 0, -1); head(ox, H - 2, 0, 1); }

    // tick labels
    if (view.scale >= 34) {
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.font = '10px ui-monospace,Menlo,monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (let k = Math.ceil(x0); k <= Math.floor(x1); k++) {
        if (k === 0) continue;
        ctx.fillText(k, sx(k), Math.min(Math.max(oy + 5, 0), H - 13));
      }
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      for (let k = Math.ceil(y0); k <= Math.floor(y1); k++) {
        if (k === 0) continue;
        ctx.fillText(k, Math.min(Math.max(ox - 6, 16), W - 4), sy(k));
      }
    }
  }

  function drawLattice() {
    const K = 40;
    ctx.strokeStyle = 'rgba(90,169,255,0.30)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = -K; k <= K; k++) {
      let [ax, ay] = apply(cur, k, -K), [bx, by] = apply(cur, k, K);
      ctx.moveTo(sx(ax), sy(ay)); ctx.lineTo(sx(bx), sy(by));
      [ax, ay] = apply(cur, -K, k); [bx, by] = apply(cur, K, k);
      ctx.moveTo(sx(ax), sy(ay)); ctx.lineTo(sx(bx), sy(by));
    }
    ctx.stroke();
  }

  function pathThrough(T, pts) {
    ctx.beginPath();
    pts.forEach(([x, y], i) => {
      const [px, py] = P(...apply(T, x, y));
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    });
    ctx.closePath();
  }

  function drawShape(T, ghost) {
    if (ghost) {
      ctx.save();
      pathThrough(T, OUTLINE);
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = 'rgba(217,230,236,0.28)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
      return;
    }
    // the four unit cells, each mapping to a parallelogram of area |det A|
    CELLS.forEach(([i, j], k) => {
      pathThrough(T, [[i,j],[i+1,j],[i+1,j+1],[i,j+1]]);
      ctx.fillStyle = k % 2 ? 'rgba(61,219,176,0.13)' : 'rgba(61,219,176,0.22)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(61,219,176,0.38)';
      ctx.lineWidth = 1;
      ctx.stroke();
    });
    pathThrough(T, OUTLINE);
    ctx.strokeStyle = '#3ddbb0';
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // vertex images
    ctx.fillStyle = '#8ff0d4';
    OUTLINE.forEach(([x, y]) => {
      const [px, py] = P(...apply(T, x, y));
      ctx.beginPath(); ctx.arc(px, py, 2.6, 0, Math.PI * 2); ctx.fill();
    });
  }

  function arrow(x0, y0, x1, y1, color, width, dashed) {
    const dx = x1 - x0, dy = y1 - y0;
    const len = Math.hypot(dx, dy);
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
    if (dashed) ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    if (len > 14) {
      const ux = dx / len, uy = dy / len, s = Math.min(11, len * 0.36);
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x1 - s*ux + s*0.42*uy, y1 - s*uy - s*0.42*ux);
      ctx.lineTo(x1 - s*ux - s*0.42*uy, y1 - s*uy + s*0.42*ux);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawBasis() {
    const [ox, oy] = apply(cur, 0, 0);
    // original basis, at the original origin
    arrow(sx(0), sy(0), sx(1), sy(0), 'rgba(255,255,255,0.22)', 1.5, true);
    arrow(sx(0), sy(0), sx(0), sy(1), 'rgba(255,255,255,0.22)', 1.5, true);

    const [ex, ey] = apply(cur, 1, 0);
    const [fx, fy] = apply(cur, 0, 1);
    arrow(sx(ox), sy(oy), sx(ex), sy(ey), '#f5a623', 2.5, false);
    arrow(sx(ox), sy(oy), sx(fx), sy(fy), '#5aa9ff', 2.5, false);

    ctx.font = '12px ui-monospace,Menlo,monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f5a623';
    ctx.fillText('Ae₁', sx(ex) + 7, sy(ey) - 7);
    ctx.fillStyle = '#5aa9ff';
    ctx.fillText('Ae₂', sx(fx) + 7, sy(fy) - 7);

    // image of the origin = translation vector
    ctx.fillStyle = cur.tx || cur.ty ? '#f5a623' : 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.arc(sx(ox), sy(oy), 3.5, 0, Math.PI * 2); ctx.fill();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawGrid();
    if (opt.lattice) drawLattice();
    if (opt.ghost) drawShape(IDENT, true);
    drawShape(cur, false);
    if (opt.basis) drawBasis();
    updateReadout();
  }

  // ───────────────────────────────── inputs ──
  const KEYS = ['a', 'b', 'c', 'd', 'tx', 'ty'];
  const inputs = {};
  let lastGood = { ...IDENT };

  KEYS.forEach(k => {
    const el = document.getElementById('i-' + k);
    inputs[k] = el;
    el.addEventListener('input', () => {
      const raw = el.value.trim();
      const v = Number(raw);
      const ok = raw !== '' && Number.isFinite(v);
      el.classList.toggle('bad', !ok);
      if (ok) lastGood[k] = v;
      kick();
    });
  });

  function readInputs() { return { ...lastGood }; }

  function writeInputs(o) {
    KEYS.forEach(k => { inputs[k].value = fmt(o[k]); inputs[k].classList.remove('bad'); });
    lastGood = { ...o };
  }

  // ───────────────────────────────── readout ──
  function fmt(v, digits = 3) {
    const p = Math.pow(10, digits);
    let r = Math.round(v * p) / p;
    if (Object.is(r, -0)) r = 0;
    return String(r);
  }

  function signed(v) {
    const r = Math.round(v * 1000) / 1000;
    if (Object.is(r, -0) || r === 0) return '0';
    return r < 0 ? '−' + fmt(-v) : fmt(v);
  }

  function updateReadout() {
    const det = cur.a * cur.d - cur.b * cur.c;
    const area = Math.abs(det) * AREA0;

    document.getElementById('r-det').textContent = fmt(det);
    document.getElementById('r-area').textContent = fmt(area);
    const orient = document.getElementById('r-orient');
    const note = document.getElementById('r-note');
    if (Math.abs(det) < 1e-9) {
      orient.textContent = 'つぶれる';
      orient.className = 'warn';
      note.innerHTML = '<span class="warn">det A = 0 → 写像は特異（正則でない）。</span>図形は直線（または1点）につぶれ、情報が失われるので逆写像は存在しない。';
    } else if (det < 0) {
      orient.textContent = '反転';
      orient.className = 'warn';
      note.textContent = 'det A < 0 → 向きが反転している。鏡に映したように図形が裏返っている。';
    } else {
      orient.textContent = '保たれる';
      orient.className = '';
      note.textContent = 'det A > 0 → 向きは保たれる。各単位正方形は面積 |det A| の平行四辺形になる。';
    }

    const [qx, qy] = apply(cur, 1, 1);
    document.getElementById('r-pt').textContent =
      `(1, 1) → (${fmt(qx, 2)}, ${fmt(qy, 2)})`;

    document.getElementById('eqn').innerHTML =
      `x′ = <b>${signed(cur.a)}</b>·x + <b>${signed(cur.b)}</b>·y + <i>${signed(cur.tx)}</i><br>` +
      `y′ = <b>${signed(cur.c)}</b>·x + <b>${signed(cur.d)}</b>·y + <i>${signed(cur.ty)}</i>`;
  }

  // ───────────────────────────────── presets ──
  const C45 = Math.SQRT1_2;
  const PRESETS = [
    ['単位行列',        [1, 0, 0, 1, 0, 0]],
    ['90° 回転',        [0, -1, 1, 0, 0, 0]],
    ['45° 回転',        [C45, -C45, C45, C45, 0, 0]],
    ['30° 回転',    [Math.cos(Math.PI/6), -Math.sin(Math.PI/6), Math.sin(Math.PI/6), Math.cos(Math.PI/6), 0, 0]],
    ['2倍に拡大',       [2, 0, 0, 2, 0, 0]],
    ['横2倍・縦½',      [2, 0, 0, 0.5, 0, 0]],
    ['せん断',          [1, 1, 0, 1, 0, 0]],
    ['せん断（逆）',    [1, 0, 1, 1, 0, 0]],
    ['x軸で鏡映',       [1, 0, 0, -1, 0, 0]],
    ['y軸で鏡映',       [-1, 0, 0, 1, 0, 0]],
    ['y = x で鏡映',    [0, 1, 1, 0, 0, 0]],
    ['x軸へ射影',       [1, 0, 0, 0, 0, 0]],
    ['回転＋平行移動',  [0, -1, 1, 0, 3, 2]],
    ['平行移動 (3,2)',  [1, 0, 0, 1, 3, 2]]
  ];

  const presetBox = document.getElementById('presets');
  PRESETS.forEach(([name, vals]) => {
    const b = document.createElement('button');
    b.textContent = name;
    b.title = `A = [${vals[0]} ${vals[1]}; ${vals[2]} ${vals[3]}], t = (${vals[4]}, ${vals[5]})`;
    b.addEventListener('click', () => {
      writeInputs({ a: vals[0], b: vals[1], c: vals[2], d: vals[3], tx: vals[4], ty: vals[5] });
      kick();
    });
    presetBox.appendChild(b);
  });

  // ───────────────────────────────── toggles ──
  const tGhost = document.getElementById('t-ghost');
  const tBasis = document.getElementById('t-basis');
  const tLat   = document.getElementById('t-lattice');
  const tAnim  = document.getElementById('t-anim');
  tGhost.addEventListener('change', () => { opt.ghost = tGhost.checked; draw(); });
  tBasis.addEventListener('change', () => { opt.basis = tBasis.checked; draw(); });
  tLat.addEventListener('change',   () => { opt.lattice = tLat.checked; draw(); });
  tAnim.addEventListener('change',  () => { opt.anim = tAnim.checked;

    if (!opt.anim && animating) { animating = false; cur = { ...goal }; draw(); } });

  // ───────────────────────────────── pan & zoom ──
  // pointer handling: one finger/mouse = pan, two fingers = pinch zoom
  const pointers = new Map();
  let dragBase = null;

  const localPt = e => {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };

  canvas.addEventListener('pointerdown', e => {
    pointers.set(e.pointerId, localPt(e));
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    canvas.classList.add('dragging');
    if (pointers.size === 1) {
      dragBase = { p: localPt(e), cx: view.cx, cy: view.cy };
    } else if (pointers.size === 2) {
      dragBase = null;
      pinchBase = pinchNow();
    }
  });

  canvas.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, localPt(e));

    if (pointers.size >= 2) {
      if (!pinchBase) { pinchBase = pinchNow(); return; }
      const now = pinchNow();
      if (pinchBase.dist > 4) {
        const f = now.dist / pinchBase.dist;
        view.scale = clampScale(pinchBase.scale * f); view.userMoved = true; view.userMoved = true;
        // keep the world point under the midpoint fixed
        const wx = (pinchBase.mx - pinchBase.cx) / pinchBase.scale;
        const wy = (pinchBase.cy - pinchBase.my) / pinchBase.scale;
        view.cx = now.mx - wx * view.scale;
        view.cy = now.my + wy * view.scale;
        draw();
      }
      return;
    }

    if (dragBase) {
      const p = localPt(e);
      view.cx = dragBase.cx + (p.x - dragBase.p.x); view.userMoved = true; view.userMoved = true; view.userMoved = true;
      view.cy = dragBase.cy + (p.y - dragBase.p.y);
      draw();
    }
  });

  function pinchNow() {
    const [p1, p2] = [...pointers.values()];
    return {
      mx: (p1.x + p2.x) / 2, my: (p1.y + p2.y) / 2,
      dist: Math.hypot(p1.x - p2.x, p1.y - p2.y),
      scale: view.scale, cx: view.cx, cy: view.cy
    };
  }
  let pinchBase = null;

  const clampScale = v => Math.min(420, Math.max(10, v));

  const endDrag = e => {
    pointers.delete(e.pointerId);
    try {
      if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    } catch (_) {}
    if (pointers.size === 0) {
      dragBase = null; pinchBase = null;
      canvas.classList.remove('dragging');
    } else if (pointers.size === 1) {
      pinchBase = null;
      const [p] = [...pointers.values()];
      dragBase = { p, cx: view.cx, cy: view.cy };
    }
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  canvas.addEventListener('wheel', e => {
    if (!(e.ctrlKey || e.metaKey)) return;   // plain wheel belongs to the page, not the canvas
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const wx = (mx - view.cx) / view.scale;
    const wy = (view.cy - my) / view.scale;
    const f = Math.exp(-e.deltaY * 0.0015);
    view.scale = clampScale(view.scale * f); view.userMoved = true;
    view.cx = mx - wx * view.scale;
    view.cy = my + wy * view.scale;
    draw();
  }, { passive: false });

  document.getElementById('z-in').addEventListener('click', () => zoomBy(1.25));
  document.getElementById('z-out').addEventListener('click', () => zoomBy(0.8));
  document.getElementById('z-fit').addEventListener('click', () => { fitView(); draw(); });

  function zoomBy(f) {
    const wx = (W/2 - view.cx) / view.scale;
    const wy = (view.cy - H/2) / view.scale;
    view.scale = clampScale(view.scale * f); view.userMoved = true;
    view.cx = W/2 - wx * view.scale;
    view.cy = H/2 + wy * view.scale;
    draw();
  }

  // ───────────────────────────────── go ──
  writeInputs(IDENT);
  new ResizeObserver(resize).observe(canvas.parentElement);
  resize();
  window.addEventListener('resize', resize);
})();

  /* --- embedded-in-an-iframe handling --------------------------------- */
  // Inside a Google Sites / LMS embed we get a fixed, often tiny box.
  // Offer a way out to the standalone page (the sandbox allows popups).
  try {
    if (window.self !== window.top) document.body.classList.add('embedded');
  } catch (_) { document.body.classList.add('embedded'); }

</script>
</body>
